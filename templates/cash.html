{% extends "base.html" %}
{% block title %}{{ 'Dépôt' if kind == 'depot' else 'Retrait' }}{% endblock %}
{% block content %}
<h1>{{ '⬇️ Déposer de l\'argent' if kind == 'depot' else '⬆️ Retirer de l\'argent' }}</h1>
<p class="sub">Solde actuel : {{ '%.2f'|format(me.balance) }} DT</p>
<div class="card" style="max-width:520px"><form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label>Montant (DT)</label><input type="number" name="amount" step="0.01" min="0.01" required>
<button class="{{ 'green' if kind == 'depot' else 'orange' }}" type="submit">Valider</button>
<a class="btn gray" href="{{ url_for('dashboard') }}">Annuler</a></form></div>
{% endblock %}
