{% extends "public.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="card form-box"><h1>Connexion</h1><p class="sub">Client ou administrateur.</p>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label>Nom d'utilisateur</label><input name="username" required autofocus autocomplete="username">
<label>Mot de passe</label><input type="password" name="password" required autocomplete="current-password">
<button type="submit">Se connecter</button></form>
<p>Pas de compte ? <a href="{{ url_for('register') }}">Inscription</a></p></div>
{% endblock %}
